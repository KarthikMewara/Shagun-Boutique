kind = "web"
previewPath = "/"
title = "Shagun Boutique"
version = "1.0.0"
id = "artifacts/shagun-boutique"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19310

[services.development]
run = "pnpm --filter @workspace/shagun-boutique run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shagun-boutique", "run", "build" ]
publicDir = "artifacts/shagun-boutique/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19310"
BASE_PATH = "/"
